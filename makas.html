<style>
:root{
  --desk:#eee8dc; --paper:#fffdf8; --strip:#f7f0e1; --strip-edge:#e7dcc4;
  --ink:#1c2b48; --print:#3a342b; --muted:#8a8070; --line:#ddd2be;
  --accent:#a4441d; --accent-soft:#f5e2d6;
  --sans:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
  --serif:'Literata',Georgia,'Times New Roman',serif;
  --hh:54px; --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--print);font-family:var(--sans);font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
svg{flex:none}

/* header */
header.top{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 18px;background:rgba(238,232,220,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);display:flex;align-items:center;gap:7px;margin-right:6px}
.brand svg{color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 11px;border-radius:7px;font-size:13px;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.btn:hover:not(:disabled){border-color:#c3b496}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover:not(:disabled){background:#2a3c60}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.6);border-color:var(--line)}
.btn.icon{padding:6px 8px}
.btn:disabled{opacity:.38}
.proj{max-width:340px}
.proj span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.status{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap;padding:0 6px}
.status.err{color:var(--accent)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 370px;min-height:calc(100vh - var(--hh))}
.layout.solo{grid-template-columns:1fr}
.layout.solo aside.side{display:none}
main{padding:34px 24px 140px;min-width:0}
.paper{max-width:780px;margin:0 auto;background:var(--paper);border-radius:3px;box-shadow:0 1px 2px rgba(70,45,10,.06),0 10px 34px rgba(70,45,10,.08);padding:52px 64px 70px 124px;position:relative;min-height:75vh}
.doc-title{display:block;width:100%;border:0;background:transparent;outline:none;font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.25;color:var(--ink);padding:0;margin:0 0 6px}
.doc-title::placeholder{color:#c9bfae}
.doc-meta{font-size:12px;color:var(--muted);margin-bottom:16px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block}
.sw.src{background:var(--strip);box-shadow:inset 0 0 0 1px var(--strip-edge)}
.sw.mine{background:var(--ink)}
.sw.quote{background:#fcf3ec;box-shadow:inset 3px 0 0 var(--accent)}
.hint{position:relative;font-size:12.5px;line-height:1.6;color:#6d6456;background:#f6f2ea;border-radius:6px;padding:10px 34px 10px 12px;margin-bottom:22px}
.hint b{color:var(--ink);font-weight:600}
.hint .x{position:absolute;right:6px;top:6px;border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;padding:4px 6px;border-radius:4px}
.hint .x:hover{background:#ece5d8}

/* blocks */
.block{position:relative;border-radius:3px;padding:10px 14px}
.block textarea{display:block;width:100%;border:0;background:transparent;resize:none;overflow:hidden;font-family:var(--serif);font-size:16.5px;line-height:1.72;color:inherit;padding:0;margin:0;outline:none}
.block textarea::selection{background:#f1cdb8}
.b-src{background:var(--strip);box-shadow:inset 0 0 0 1px var(--strip-edge);color:var(--print)}
.b-src textarea{font-size:15.5px}
.b-mine{color:var(--ink)}
.b-mine:focus-within{box-shadow:inset 0 0 0 1px #d6dbe6}
.b-mine textarea::placeholder{color:#a3acbf;font-style:italic}
.b-quote{margin-left:36px;margin-right:6px;border-left:3px solid var(--accent);background:#fcf4ed;border-radius:0 3px 3px 0}
.b-quote textarea{font-style:italic;font-size:15.5px;color:#43392f}
.q-meta{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--accent)}
.q-meta input{flex:1;min-width:0;border:0;border-bottom:1px dashed transparent;background:transparent;font:inherit;font-weight:500;color:inherit;outline:none;padding:1px 0}
.q-meta input:hover{border-bottom-color:#e2bfa9}
.q-meta input:focus{border-bottom-color:var(--accent)}
.q-note{font-size:12px;color:var(--muted);font-style:italic;margin-top:3px}
.b-label{position:absolute;left:-104px;top:14px;width:76px;text-align:right;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:#bbb09d;pointer-events:none}
.b-quote .b-label{left:-140px}
.b-mine .b-label{color:#a7b0c2}
.handle{position:absolute;left:-26px;top:10px;width:20px;height:26px;display:grid;place-items:center;color:#b5a991;cursor:grab;opacity:0;border-radius:4px;transition:opacity .12s}
.handle:hover{background:#f1ebdf;color:var(--ink)}
.block:hover .handle,.block:focus-within .handle{opacity:1}
.b-actions{position:absolute;right:8px;top:-12px;display:flex;gap:4px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:3}
.block:hover .b-actions,.block:focus-within .b-actions{opacity:1;pointer-events:auto}
.mini{font-size:11.5px;padding:3px 9px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--print);white-space:nowrap}
.mini:hover{color:var(--accent);border-color:var(--accent)}

/* gaps */
.gap{position:relative;height:16px;display:flex;align-items:center;justify-content:center;transition:height .12s}
.gap-line{position:absolute;left:0;right:0;top:50%;border-top:1px dashed transparent}
.gap-acts{position:relative;display:flex;gap:6px;opacity:0;transition:opacity .12s;z-index:2}
.gap:hover .gap-acts,.gap:focus-within .gap-acts{opacity:1}
.gap:hover .gap-line{border-top-color:var(--line)}
.gap-acts button{font-size:11.5px;padding:2px 10px;border-radius:20px;border:1px solid var(--line);background:var(--paper);color:var(--muted)}
.gap-acts button:hover{color:var(--ink);border-color:var(--ink)}
.gap.end{height:64px;align-items:flex-start;padding-top:14px}
.gap.end .gap-line{top:22px}
.gap.end .gap-acts{opacity:.75}
.gap .empty-msg{display:none}
.gap.empty{height:auto;flex-direction:column;gap:12px;padding:40px 0}
.gap.empty .empty-msg{display:block;font-size:13px;color:var(--muted);text-align:center}
.gap.empty .gap-acts{opacity:1}
.gap .place-btn{display:none;position:relative;z-index:2;font-size:12px;padding:3px 14px;border-radius:20px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.gap .place-btn:hover{background:var(--accent);color:#fff}
body.placing .gap{height:34px}
body.placing .gap .gap-acts{display:none}
body.placing .gap .gap-line{border-top:1px dashed #dcb79f}
body.placing .gap .place-btn{display:inline-block}
body.dragging .gap{height:26px}
body.dragging .gap-acts{display:none}
body.dragging .gap .gap-line{border-top:1px dashed #d6c7ab}
.gap.over .gap-line{border-top:3px solid var(--accent)!important}

/* side */
aside.side{border-left:1px solid var(--line);background:#f5f0e6;position:sticky;top:var(--hh);height:calc(100vh - var(--hh));display:flex;flex-direction:column;transition:background .12s}
aside.side.over{background:#efe4d3}
.side-head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
.side-title{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink);display:flex;align-items:baseline;gap:8px}
.side-title small{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:400}
.side-tools{display:flex;gap:6px;margin-top:10px}
.side-tools input,.side-tools select{flex:1;min-width:0;border:1px solid var(--line);border-radius:7px;padding:6px 9px;font:inherit;font-size:12.5px;background:var(--card);color:var(--ink);outline:none}
.side-tools input:focus,.side-tools select:focus{border-color:#b9a88a}
.cards{flex:1;overflow:auto;padding:14px 16px 60px;display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid #e5dac6;border-radius:4px;padding:11px 13px 10px;cursor:grab;position:relative;transition:border-color .12s}
.card:hover{border-color:#cbb998}
.card.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-soft);border-color:var(--accent)}100%{background:var(--card)}}
.c-src{font-size:11.5px;color:var(--accent);font-weight:500;margin-bottom:5px;line-height:1.35}
.c-src.me{color:#5a6a8a}
.c-src.none{color:var(--muted);font-style:italic;font-weight:400}
.c-text{font-family:var(--serif);font-size:14px;line-height:1.55;color:var(--print);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.card.open .c-text{-webkit-line-clamp:unset;display:block}
.c-note{font-size:12px;color:var(--muted);font-style:italic;margin-top:6px}
.c-actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;opacity:0;transition:opacity .12s}
.card:hover .c-actions,.card:focus-within .c-actions{opacity:1}
.card.editing{cursor:default}
.card.editing textarea,.card.editing input{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px 9px;font:inherit;font-size:13px;margin-bottom:6px;outline:none;background:var(--card)efb;color:var(--ink)}
.card.editing textarea{font-family:var(--serif);font-size:14px;line-height:1.5;min-height:110px;resize:vertical}
.card.editing label{display:block;font-size:11px;color:var(--muted);margin:2px 0 3px}
.drop-line{height:3px;background:var(--accent);border-radius:2px;margin:-6px 0;flex:none}
.side-empty{color:var(--muted);font-size:13px;line-height:1.65;text-align:center;padding:34px 20px;border:1.5px dashed #d6c9b1;border-radius:8px}
.side-empty b{color:var(--ink)}

/* floating bars */
#cutbar{position:fixed;z-index:50;display:none;background:var(--ink);border-radius:9px;padding:4px;box-shadow:0 8px 24px rgba(20,25,40,.25)}
#cutbar button{background:transparent;border:0;color:#fff;padding:7px 12px;border-radius:6px;font-size:13px;display:flex;align-items:center;gap:8px}
#cutbar button:hover{background:rgba(255,255,255,.13)}
kbd{font-family:var(--sans);font-size:10.5px;opacity:.6;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:0 5px}
#placebar{position:fixed;left:50%;top:calc(var(--hh) + 12px);transform:translateX(-50%);z-index:40;display:none;align-items:center;gap:12px;background:var(--accent);color:#fff;padding:8px 8px 8px 16px;border-radius:30px;box-shadow:0 8px 24px rgba(120,40,10,.25);font-size:13px}
body.placing #placebar{display:flex}
#placebar .btn{background:var(--card);color:var(--accent);border-color:#fff;border-radius:20px;padding:4px 12px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;transition:.18s;z-index:70;background:var(--ink);color:#fff;border-radius:9px;padding:9px 10px 9px 16px;font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(20,25,40,.25)}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:6px;padding:4px 10px;font-size:12.5px}
#toast button:hover{background:rgba(255,255,255,.25)}

/* popover */
.pop{position:fixed;z-index:55;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(60,40,10,.18);min-width:270px;max-width:380px;max-height:62vh;overflow:auto;padding:6px}
.pop-item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--ink);line-height:1.35}
.pop-item:hover{background:var(--strip)}
.pop-item.cur{font-weight:600}
.pop-item small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;margin-top:2px}
.pop-item.danger{color:var(--accent)}
.pop-sep{height:1px;background:var(--line);margin:5px 4px}
.pop input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;margin-bottom:4px;outline:none}
.pop .pi-src{font-size:11px;color:var(--accent);font-weight:500}
.pop .pi-src.me{color:#5a6a8a}
.pop .pi-txt{font-family:var(--serif);font-size:13px;color:var(--print);display:block;margin-top:2px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(45,32,12,.3);display:flex;align-items:flex-start;justify-content:center;padding:9vh 16px 16px;z-index:60;overflow:auto}
.modal{background:var(--paper);border-radius:12px;width:min(540px,100%);box-shadow:0 24px 70px rgba(40,25,5,.28);padding:22px 24px 20px}
.modal h3{font-family:var(--serif);font-weight:600;font-size:20px;margin:0 0 12px;color:var(--ink)}
.modal p{line-height:1.6;margin:0 0 10px}
.field label{display:block;font-size:12px;color:var(--muted);margin:14px 0 5px}
.field input,.field textarea,.modal textarea.big{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;font:inherit;font-size:14px;background:var(--card);color:var(--ink);outline:none}
.field input:focus,.field textarea:focus,.modal textarea.big:focus{border-color:#9c8b6c}
.modal textarea.big{font-family:var(--serif);min-height:220px;line-height:1.6;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--print);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.me{border-style:dashed;color:#4f5f80}
.preview{font-family:var(--serif);font-size:14px;line-height:1.55;background:var(--strip);padding:10px 12px;border-radius:6px;max-height:150px;overflow:auto;color:var(--print);white-space:pre-wrap}
.err-msg{color:var(--accent);font-size:12px;margin-top:7px;min-height:1em}
.m-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;margin-top:18px}
.chks{display:flex;flex-direction:column;gap:8px;margin:4px 0 16px}
.chk{display:flex;align-items:center;gap:9px;font-size:13.5px;cursor:pointer}
.chk input{accent-color:var(--accent);width:16px;height:16px}
.fmts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fmt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.fmt:hover:not(:disabled){border-color:var(--ink)}
.fmt b{font-size:13.5px;color:var(--ink);font-weight:600}
.fmt small{font-size:11.5px;color:var(--muted);line-height:1.4}
.fmt.wide{grid-column:1/-1;margin-top:8px;background:#f8f4ec}
.fmt:disabled{opacity:.45}
.fb-ta{width:100%;min-height:220px;border:1px solid var(--line);border-radius:7px;padding:10px;font-family:var(--serif);font-size:13px;line-height:1.5;background:var(--card)}

/* start */
.paper.start{padding:52px 64px 60px}
.start-h{font-family:var(--serif);font-weight:600;font-size:30px;color:var(--ink);margin:0 0 8px}
.start-p{font-size:14px;line-height:1.65;color:#6b6253;margin:0 0 24px;max-width:560px}
.lbl{display:block;font-size:12px;color:var(--muted);margin:16px 0 6px}
.field-in{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-family:var(--serif);font-size:17px;color:var(--ink);outline:none;background:var(--card)}
.start-ta{width:100%;min-height:300px;border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-family:var(--serif);font-size:15px;line-height:1.65;color:var(--print);outline:none;background:var(--strip);resize:vertical}
.field-in:focus,.start-ta:focus{border-color:#9c8b6c}
.start-row{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.start-row.small{margin-top:20px}
.start-h2{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);margin:42px 0 10px;padding-top:24px;border-top:1px solid var(--line)}

<script>
(() => {
'use strict';
const KEY = 'makas.v1';
const ME = 'me';
const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const PILE_COLORS = ['#b5542c', '#4f7a4a', '#3f6aa1', '#8a5a9e', '#b08a2e', '#4f8a8a'];
const $ = (s, r = document) => r.querySelector(s);
const main = $('#main'), side = $('#side'), layout = $('#layout');
const GRIP = '<svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor"><circle cx="3" cy="3" r="1.4"/><circle cx="9" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="9" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="9" cy="13" r="1.4"/></svg>';

/* ---------- state ---------- */
let store = { projects: {}, current: null, hintClosed: false };
try {
  const raw = localStorage.getItem(KEY);
  if (raw) { const s = JSON.parse(raw); if (s && s.projects) store = Object.assign(store, s); }
} catch (e) {}
const inArtifact = !!(window.claude && window.claude.use);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

/* migrate projects made with the first version (free-text sources) */
function migrate(p) {
  if (!p) return p;
  // colours come from saved or imported files: accept plain hex colours only
  (p.piles || []).forEach(pl => { if (!/^#[0-9a-f]{3,8}$/i.test(pl.color || '')) pl.color = '#8a8070'; });
  if (p.v >= 2) return p;
  const lib = [], map = {};
  const sid = s => {
    s = (s || '').trim();
    if (!s) return '';
    if (s === 'Kendi notum') return ME;
    if (!map[s]) { const id = 's' + uid(); map[s] = id; lib.push({ id, author: '', title: s, translator: '', publisher: '', year: '' }); }
    return map[s];
  };
  (p.cards || []).forEach(c => { c.srcId = sid(c.source); c.page = ''; delete c.source; });
  (p.blocks || []).forEach(b => { if ('source' in b) { b.srcId = sid(b.source); b.page = ''; delete b.source; } });
  (p.sources || []).forEach(sid);
  p.recent = (p.sources || []).map(s => map[s]).filter(Boolean);
  p.lastSrcId = sid(p.lastSource);
  delete p.sources; delete p.lastSource;
  p.lib = lib; p.piles = p.piles || []; p.versions = p.versions || [];
  p.cards = p.cards || []; p.blocks = p.blocks || [];
  p.v = 2;
  return p;
}
Object.values(store.projects).forEach(migrate);

const P = () => (store.current && store.projects[store.current]) || null;
function recent() {
  const l = Object.values(store.projects).sort((a, b) => (b.updated || 0) - (a.updated || 0));
  return l[0] || null;
}
if (!P() && recent()) store.current = recent().id;
let screen = P() ? 'desk' : 'start';
let readMode = false;
let hist = [], fut = [];
let typingPending = false;
let drag = null, placing = null, selInfo = null, lastCaret = null;
let sideFilter = { q: '', src: '', pile: '' };
let editedSinceLoad = false;

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const mini = (label, fn, title) => el('button', { class: 'mini', type: 'button', title, onmousedown: e => e.preventDefault(), onclick: fn }, label);
const fmtDate = ts => { try { return new Date(ts).toLocaleString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const trunc = (s, n) => (s = (s || '').replace(/\s+/g, ' ').trim()).length > n ? s.slice(0, n - 1) + '…' : s;
const lc = s => (s || '').toLocaleLowerCase('tr-TR');
const countWords = s => ((s || '').match(/[\p{L}\p{N}]+(?:['’\-][\p{L}\p{N}]+)*/gu) || []).length;
const fmtNum = n => n.toLocaleString('tr-TR');

function splitText(t) {
  t = (t || '').replace(/\r\n?/g, '\n').trim();
  if (!t) return [];
  let parts = t.split(/\n[ \t]*\n+/);
  if (parts.length === 1 && t.includes('\n')) parts = t.split('\n');
  return parts.map(s => s.trim()).filter(Boolean);
}
function defaultPiles() { return [['Giriş', '#3f6aa1'], ['Gelişme', '#b08a2e'], ['Sonuç', '#4f7a4a']].map(([name, color]) => ({ id: 'y' + uid(), name, color })); }
function defaultOpts() { return { cite: 'paren', biblio: true, src: true, left: false }; }
function opts() { const p = P(); if (!p.opts) p.opts = defaultOpts(); return p.opts; }

/* ---------- sources ---------- */
function libGet(id) { const p = P(); return (p && p.lib || []).find(e => e.id === id) || null; }
function surname(a) {
  a = (a || '').trim(); if (!a) return '';
  if (a.includes(',')) return a.split(',')[0].trim();
  if (/\s(ve|&|and)\s/i.test(a)) return a;
  const w = a.split(/\s+/); return w[w.length - 1];
}
function invertAuthor(a) {
  a = (a || '').trim();
  if (!a || a.includes(',') || /\s(ve|&|and)\s/i.test(a)) return a;
  const w = a.split(/\s+/); if (w.length < 2) return a;
  return w[w.length - 1] + ', ' + w.slice(0, -1).join(' ');
}
function srcLabel(id) {
  if (id === ME) return 'Kendi notum';
  const e = libGet(id); if (!e) return '';
  return [surname(e.author), e.title].filter(Boolean).join(', ') || 'Adsız kaynak';
}
function srcShort(id, page) { const l = srcLabel(id); return l ? l + (page && id !== ME ? ', s. ' + page : '') : ''; }
function srcLong(e) { return [e.author, e.title, e.translator && 'çev. ' + e.translator, e.publisher, e.year].filter(Boolean).join(', '); }
function joinRuns(segs, sep, end) {
  const out = [];
  segs.filter(s => s && s.t).forEach((s, i) => { if (i) out.push({ t: sep }); out.push(s); });
  if (out.length) out.push({ t: end });
  return out;
}
function fullRuns(id, page) {
  const e = libGet(id); if (!e) return [{ t: srcShort(id, page) + '.' }];
  return joinRuns([{ t: e.author }, { t: e.title, i: true }, { t: e.translator && 'çev. ' + e.translator }, { t: e.publisher }, { t: e.year }, { t: page && 's. ' + page }], ', ', '.');
}

/* ---------- remote (account) storage ---------- */
let db = null, uidv = null;

const metaRef = id => db.doc('data/users/' + uidv + '/' + id);
const partsCol = id => metaRef(id).collection('parts');
async function withRetry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 700); return fn(); }
    throw e;
  }
}
function chunkStr(s, n) {
  const out = []; let i = 0;
  while (i < s.length) {
    let end = Math.min(s.length, i + n);
    const c = s.charCodeAt(end - 1);
    if (end < s.length && c >= 0xD800 && c <= 0xDBFF) end--;
    out.push(s.slice(i, end)); i = end;
  }
  return out.length ? out : [''];
}
async function remoteSave(id) {
  if (!db) return;
  if (writing[id]) { pendingW[id] = true; return; }
  writing[id] = true;
  try {
    do {
      pendingW[id] = false;
      const pr = store.projects[id];
      if (!pr) break;
      const chunks = chunkStr(JSON.stringify(pr), 60000);
      const lp = lastParts[id] || (lastParts[id] = []);
      for (let i = 0; i < chunks.length; i++) {
        if (lp[i] !== chunks[i]) {
          await withRetry(() => partsCol(id).doc(String(i)).set({ s: chunks[i] }));
          lp[i] = chunks[i];
        }
      }
      const meta = { title: pr.title || '', updated: pr.updated || Date.now(), created: pr.created || Date.now(), n: chunks.length };
      await withRetry(() => metaRef(id).set(meta));
      remoteMeta[id] = meta;
    } while (pendingW[id]);
    if (!saveT) setStatus('saved');
  } catch (e) {
    setStatus(e && e.code === 'quota_exceeded' ? 'quota' : 'error');
  } finally { writing[id] = false; }
}
async function loadParts(id, n) {
  const arr = [];
  for (let i = 0; i < n; i++) {
    const s = await partsCol(id).doc(String(i)).get();
    if (!s.exists) return null;
    const v = (s.data() || {}).s;
    if (typeof v !== 'string') return null;
    arr.push(v);
    (lastParts[id] || (lastParts[id] = []))[i] = v;
  }
  return arr.join('');
}
async function remoteDelete(id) {
  if (!db) return;
  const m = remoteMeta[id];
  try {
    await metaRef(id).delete();
    for (let i = 0; i < ((m && m.n) || 0); i++) await partsCol(id).doc(String(i)).delete();
  } catch (e) {}
  delete remoteMeta[id]; delete lastParts[id];
}
async function initRemote() {
  if (!(window.claude && window.claude.use)) { setStatus('local'); return; }
  let d = null, u = null;
  try { [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) {}
  if (!d || !u) { setStatus('local'); return; }
  try { uidv = await u.id(); } catch (e) {}
  if (!uidv) { setStatus('local'); return; }
  db = d;
  let done = false;
  const timer = setTimeout(() => { if (!done) setStatus('slow'); }, 10000);
  try {
    const snap = await db.collection('data/users/' + uidv).get();
    let changedCurrent = false, gotNew = false;
    for (const ds of snap.docs) {
      const m = ds.data();
      if (!m || typeof m.n !== 'number') continue;
      remoteMeta[ds.id] = m;
      const loc = store.projects[ds.id];
      if (!loc || (m.updated || 0) > (loc.updated || 0)) {
        if (loc && ds.id === store.current && editedSinceLoad) continue;
        const s = await loadParts(ds.id, m.n);
        if (!s) continue;
        try {
          const pr = migrate(JSON.parse(s));
          if (pr && Array.isArray(pr.blocks)) {
            store.projects[ds.id] = pr; gotNew = true;
            if (ds.id === store.current) changedCurrent = true;
          }
        } catch (e) {}
      }
    }
    done = true; clearTimeout(timer);
    for (const id of Object.keys(store.projects)) {
      const m = remoteMeta[id];
      if (!m || (store.projects[id].updated || 0) > (m.updated || 0)) remoteSave(id);
    }
    persistLocal();
    if (screen === 'start') {
      const ta = $('.start-ta'), ti = $('.field-in');
      const untouched = !ta || (!ta.value && !(ti && ti.value));
      if (gotNew && untouched) {
        if (!store.current) { const r = recent(); if (r) { store.current = r.id; screen = 'desk'; } }
        renderAll();
      }
    } else if (changedCurrent) { hist = []; fut = []; renderAll(); }
    setStatus('saved');
  } catch (e) {
    done = true; clearTimeout(timer); db = null; setStatus('local');
  }
}

async function readDocx(file) {
  if (!window.JSZip) throw new Error('nozip');
  const zip = await JSZip.loadAsync(file);
  const f = zip.file('word/document.xml');
  if (!f) throw new Error('nodoc');
  const xml = await f.async('string');
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  const out = [];
  for (const p of doc.getElementsByTagNameNS(W_NS, 'p')) {
    let t = '';
    for (const n of p.getElementsByTagNameNS(W_NS, '*')) {
      if (n.localName === 't') t += n.textContent;
      else if (n.localName === 'tab') t += '\t';
      else if (n.localName === 'br' || n.localName === 'cr') t += '\n';
    }
    if (t.trim()) out.push(t.trim());
  }
  return out.join('\n\n');
}
let pdfP = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve();
  if (!pdfP) pdfP = new Promise((res, rej) => {
    const base = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    const s1 = el('script', { src: base + 'pdf.worker.min.js' });
    s1.onload = () => {
      const s2 = el('script', { src: base + 'pdf.min.js' });
      s2.onload = () => window.pdfjsLib ? res() : rej(new Error('nopdf'));
      s2.onerror = rej; document.head.append(s2);
    };
    s1.onerror = rej; document.head.append(s1);
  }).catch(e => { pdfP = null; throw e; });
  return pdfP;
}
async function readPdf(file) {
  await loadPdfJs();
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  const paras = [];
  for (let n = 1; n <= pdf.numPages; n++) {
    const page = await pdf.getPage(n);
    const tc = await page.getTextContent();
    const lines = []; let cur = { t: '', y: null };
    for (const it of tc.items) {
      if (!('str' in it)) continue;
      const iy = it.transform[5];
      if (cur.y !== null && it.str.trim() && Math.abs(iy - cur.y) > 2) { lines.push(cur); cur = { t: '', y: null }; }
      if (cur.y === null && it.str.trim()) cur.y = iy;
      cur.t += it.str;
      if (it.hasEOL) { lines.push(cur); cur = { t: '', y: null }; }
    }
    if (cur.t.trim()) lines.push(cur);
    const gaps = [];
    for (let i = 1; i < lines.length; i++) if (lines[i].y != null && lines[i - 1].y != null) { const g = lines[i - 1].y - lines[i].y; if (g > 0) gaps.push(g); }
    gaps.sort((a, b) => a - b);
    const med = gaps.length ? gaps[Math.floor((gaps.length - 1) / 4)] : 12;
    let para = '', prevY = null;
    const flush = () => { if (para.trim()) paras.push(para.trim()); para = ''; };
    for (const L of lines) {
      const t = L.t.replace(/\s+/g, ' ').trim();
      if (!t) { flush(); continue; }
      if (prevY != null && L.y != null) { const g = prevY - L.y; if (g > med * 1.45 || g < 0) flush(); }
      if (L.y != null) prevY = L.y;
      if (!para) para = t;
      else if (/[-‐]$/.test(para) && /^\p{Ll}/u.test(t)) para = para.replace(/[-‐]$/, '') + t;
      else para += ' ' + t;
    }
    flush();
  }
  const out = paras.join('\n\n');
  if (!out.trim()) throw new Error('notext');
  return out;
}
async function readFileText(file) {
  if (/\.docx$/i.test(file.name)) return readDocx(file);
  if (/\.pdf$/i.test(file.name) || file.type === 'application/pdf') return readPdf(file);
  return (await file.text()).replace(/^﻿/, '');
}

function buildTxt(o) {

  let s = parts.map(x => {
    const t = plain(x.runs);
    if (x.bib && nt && !put) { put = true; return nt + '\n\n\n' + t.toLocaleUpperCase('tr-TR'); }
    switch (x.k) {
      case 'title': return t + '\n' + '='.repeat(Math.min(60, t.length));
      case 'quote': return '    ' + t;
      case 'h': return '\n' + t.toLocaleUpperCase('tr-TR');

      case 'note': return '    ' + t;

  let s = parts.map(x => {
    const t = md(x.runs);
    switch (x.k) {
      case 'title': return '# ' + plain(x.runs);
      case 'quote': return '> ' + t;
      case 'h': return '## ' + t;
      case 'li': return '- ' + t;
      case 'note': return '> ' + t;
      default: return t;
    }

  if (notes.length) s += '\n\n' + notes.map(n => '[^' + n.n + ']: ' + md(n.runs)).join('\n');

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function buildHtml(o, title) {

    if (x.k !== 'li' && inList) { body += '</ul>\n'; inList = false; }
    if (x.bib && !fnPut) { fnPut = true; body += fnHtml; }
    if (x.k === 'title') body += '<h1>' + h(x.runs) + '</h1>\n';
    else if (x.k === 'p') body += '<p>' + h(x.runs) + '</p>\n';
    else if (x.k === 'quote') body += '<blockquote>' + h(x.runs) + '</blockquote>\n';
    else if (x.k === 'h') body += '<h2>' + h(x.runs) + '</h2>\n';
    else if (x.k === 'li') { if (!inList) { body += '<ul class="bib">\n'; inList = true; } body += '<li>' + h(x.runs) + '</li>\n'; }
    else if (x.k === 'note') body += '<p class="note">' + h(x.runs) + '</p>\n';

  if (!fnPut) body += fnHtml;
  return '<!DOCTYPE html>\n<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>' + esc(title || 'Çalışma') + '</title>' +
    '<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">' +
    '<style>body{font-family:Literata,Georgia,serif;font-size:17px;line-height:1.75;color:#222;max-width:680px;margin:64px auto;padding:0 28px}' +
    'h1{font-size:30px;line-height:1.25;margin:0 0 36px}h2{font-size:19px;margin:48px 0 12px}p{margin:0 0 16px;text-align:justify;hyphens:auto}' +
    'blockquote{margin:0 2.4em 16px;font-style:italic;font-size:16px;color:#333}sup a{color:#a4441d;text-decoration:none;font-size:.75em}' +
    'ul.bib{list-style:none;padding:0}ul.bib li{padding-left:1.6em;text-indent:-1.6em;margin:6px 0}.note{font-size:14px;color:#777;margin-left:2.4em;font-style:italic}' +
    'ol.fns{font-size:14px;line-height:1.6;color:#555;border-top:1px solid #ccc;margin-top:48px;padding-top:16px}ol.fns a{color:#999;text-decoration:none}' +
    '@page{margin:2.4cm}@media print{body{margin:0 auto;max-width:none;padding:0;font-size:12pt}h1{font-size:20pt}ol.fns a{display:none}}</style></head><body>\n' + body + '</body></html>\n';
}

    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style>' +
    '<w:style w:type="paragraph" w:styleId="FootnoteText"><w:name w:val="footnote text"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="60" w:line="240" w:lineRule="auto"/><w:jc w:val="both"/></w:pPr><w:rPr><w:sz w:val="20"/><w:szCs w:val="20"/></w:rPr></w:style>' +
    '<w:style w:type="character" w:styleId="FootnoteReference"><w:name w:val="footnote reference"/><w:rPr><w:vertAlign w:val="superscript"/></w:rPr></w:style></w:styles>';
  const sep = '<w:footnote w:type="separator" w:id="-1"><w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr><w:r><w:separator/></w:r></w:p></w:footnote><w:footnote w:type="continuationSeparator" w:id="0"><w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr><w:r><w:continuationSeparator/></w:r></w:p></w:footnote>';

const fileBase = t => ((t || 'calisma').replace(/[\\/:*?"<>|\n\r\t]+/g, ' ').trim().slice(0, 80) || 'calisma');

    el('div', { class: 'guide' },
      sec('1 · Metni getir', pp('Alıntılarını ve notlarını yapıştır ya da ', b('Dosya yükle'), ' ile .txt, .md, .docx veya .pdf getir; dosyayı alana sürükleyip bırakmak da olur. ', b('Parçalara ayır'), ' dediğinde her paragraf kâğıtta ayrı bir parça olur.')),

      sec('4 · Yaz', pp('İki parçanın arasına gelince ', b('+ yaz'), ' çıkar; bağlantı cümlelerini oraya yazarsın. Kâğıttaki her parçayı soldaki tutamağından tutup başka bir araya taşıyabilirsin.')),
      sec('5 · Yerleştir', pp('Kenardaki parçayı kâğıtta bir araya sürükle ya da ', b('Metne koy'), ' de: ayrı, girintili bir alıntı olur. Cümlenin içine koymak için önce yazında yere tıkla, sonra parçadaki ', b('Cümleye ekle'), '’ye bas: tırnak içinde o noktaya girer, kaynağı altında görünür.')),
      sec('6 · Alıntı mı, atıf mı?', pp('Her parçanın ', b('tür'), ' menüsünden seçersin. ', b('Alıntı'), ' kelimesi kelimesine; ', b('atıf'), ' fikir onun, cümle senin (tırnaksız ama kaynaklı); ', b('düz metin'), ' kaynaksız.')),
      sec('7 · Oku ve sakla', pp(b('Oku'), ' düğmesi metni okurun göreceği hâliyle gösterir. Çalışman kendiliğinden ', inArtifact ? 'hesabına' : 'bu tarayıcıya', ' kaydedilir. Çalışmalarım menüsündeki ', b('Bu hâlini sakla'), ' ile bir taslağı saklayıp günler sonra ona dönebilirsin.')),
      sec('8 · Çıktı al', pp(b('İndir / Çıktı'), ': Word (kaynaklar gerçek dipnot olarak), yazdırılabilir sayfa, düz metin ya da Markdown. Kaynaklar parantez içinde ya da dipnotta gösterilir, sona kaynakça eklenir. ', b('Proje dosyası'), ' ise çalışmanın tam yedeğidir; başka bir bilgisayarda Makas’a açıp kaldığın yerden sürersin.')),
      sec('Kısayollar', pp(b('Ctrl+K'), ' seçili yeri kes · ', b('Ctrl+Z'), ' geri al · ', b('Ctrl+Shift+Z'), ' yinele · ', b('Esc'), ' vazgeç')),
      inArtifact ? null : sec('Metinlerin nerede?', pp('Hiçbir sunucuya gönderilmez; yalnızca kullandığın tarayıcıda durur. Tarayıcı verilerini silersen çalışmaların da silinir; önemli bir çalışmayı ara ara proje dosyası olarak indirmeni öneririm.'))),
    el('div', { class: 'm-actions' }, el('button', { class: 'btn primary', type: 'button', onclick: () => m.close() }, 'Anladım'))

/* ---------- wiring ---------- */
$('#projBtn').addEventListener('click', e => { if (pop) { closePop(); return; } projMenu(e.currentTarget); });
$('#undoBtn').addEventListener('click', undo);

document.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName) || '';
  const inField = tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT';
  if (e.key === 'Escape') {
    if (modals.length) { modals[modals.length - 1].close(); return; }
    if (pop) { closePop(); return; }
    if (placing) { stopPlacing(); return; }
    hideCut(); return;
  }
  if (inField || modals.length || screen !== 'desk' || readMode) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && (e.key === 'z' || e.key === 'Z')) { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); redo(); }
});
